# Server Port
server.port=8080

# Dedicated MySQL Project Database Configuration (ONLY ecommerce_db)
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Secret Key
app.jwt.secret=${JWT_SECRET}

# JPA / Hibernate Configuration for ecommerce_db
# 'update' automatically creates/updates tables strictly inside ecommerce_db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
